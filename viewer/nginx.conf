server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # tracce esportate da scripts/export_trace.py (volume montato in /data/traces)
    location /traces/ {
        alias /data/traces/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }

    # esempi di configurazione per l'editor del viewer (volume montato in /data/configs)
    location /configs/ {
        alias /data/configs/;
        add_header Cache-Control "no-store";
    }

    # stream live dal servizio `sim` (scripts/sim_server.py). Il nome si risolve a ogni richiesta, cosi'
    # nginx parte anche se `sim` non c'e' (in quel caso /live/ risponde 502 e il viewer lo nasconde).
    resolver 127.0.0.11 valid=10s;
    location /live/ {
        set $sim http://sim:8081;
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass $sim;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;        # SSE: i dati devono passare subito
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        add_header Cache-Control "no-cache";
    }
}
