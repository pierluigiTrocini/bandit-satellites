server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # tracce esportate da scripts/export_trace.py (volume montato in /data/traces)
    location /traces/ {
        alias /data/traces/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-cache";
    }
}
